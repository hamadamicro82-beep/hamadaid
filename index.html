  <style>
    html, body { height: 100%; }
    body { background: #050807; font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; }

    /* Social buttons */
    .social-btn {
      width: 46px; height: 46px; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; cursor: pointer; border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      box-shadow: 0 6px 20px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.18);
      transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s, background .3s, border-color .3s;
      padding: 0; text-decoration: none;
    }
    .social-btn svg { width: 22px; height: 22px; transition: transform .3s; }
    .social-btn:hover { transform: translateY(-4px) scale(1.12); }
    .social-btn:hover svg { transform: scale(1.08); }
    .social-btn:focus-visible { outline: 2px solid #34d399; outline-offset: 3px; }

    .social-btn.ig:hover { background: linear-gradient(45deg,#f09433,#dc2743,#bc1888); border-color: transparent; box-shadow: 0 0 26px rgba(220,39,67,.7); }
    .social-btn.wa:hover { background: #25D366; border-color: transparent; box-shadow: 0 0 26px rgba(37,211,102,.75); }
    .social-btn.dc:hover { background: #5865F2; border-color: transparent; box-shadow: 0 0 26px rgba(88,101,242,.8); }

    /* Card */
    .card {
      position: relative; z-index: 10;
      background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.16);
      -webkit-backdrop-filter: blur(22px) saturate(140%); backdrop-filter: blur(22px) saturate(140%);
      box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(16,185,129,.08), inset 0 1px 0 rgba(255,255,255,.22);
      animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
    }
    .card::before {
      content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
      background: linear-gradient(135deg, rgba(52,211,153,.55), transparent 35%, transparent 65%, rgba(16,185,129,.4));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
    }

    .title-glow {
      background: linear-gradient(90deg, #6ee7b7, #10b981 45%, #34d399 70%, #a7f3d0);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 14px rgba(16,185,129,.55));
      animation: shine 6s linear infinite;
    }

    .chip-dot { box-shadow: 0 0 10px #34d399; animation: pulse 2s ease-in-out infinite; }

    .toast {
      position: fixed; left: 50%; bottom: 28px; z-index: 100;
      transform: translate(-50%, 24px); opacity: 0; pointer-events: none;
      transition: all .35s ease;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    /* Animated background */
    body { overflow: hidden; }
    .bg-anim { will-change: transform; animation: kenburns 26s ease-in-out infinite alternate; }
    #bgVideo { animation: none; }
    .aura {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(60% 50% at 20% 80%, rgba(16,185,129,.28), transparent 70%),
        radial-gradient(50% 45% at 85% 20%, rgba(52,211,153,.2), transparent 70%);
      mix-blend-mode: screen;
      animation: aura 9s ease-in-out infinite alternate;
    }
    @keyframes kenburns {
      0%   { transform: scale(1.05) translate3d(0, 0, 0); }
      100% { transform: scale(1.18) translate3d(-1.8%, -1.5%, 0); }
    }
    @keyframes aura {
      0%   { opacity: .45; transform: scale(1); }
      100% { opacity: 1;   transform: scale(1.12); }
    }

    @keyframes rise { from { opacity: 0; transform: translateY(28px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes shine { to { background-position: 200% center; } }
    @keyframes pulse { 50% { opacity: .45; } }

    @media (prefers-reduced-motion: reduce) {
      .card, .title-glow, .chip-dot, .bg-anim, .aura { animation: none; }
      .social-btn { transition: none; }
    }
  </style>

  <script>
    /* Floating emerald embers */
    (function () {
      var c = document.getElementById('embers');
      if (!c || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var ctx = c.getContext('2d'), w, h, dpr = Math.min(window.devicePixelRatio || 1, 2), parts = [];

      function resize() {
        w = window.innerWidth; h = window.innerHeight;
        c.width = w * dpr; c.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      function make(initial) {
        return {
          x: Math.random() * w,
          y: initial ? Math.random() * h : h + 10,
          r: Math.random() * 2.2 + 0.6,
          vy: Math.random() * 0.7 + 0.25,
          vx: (Math.random() - 0.5) * 0.35,
          a: Math.random() * 0.6 + 0.25,
          ph: Math.random() * Math.PI * 2
        };
      }
      function init() {
        resize();
        var n = Math.round(Math.min(90, Math.max(35, w / 16)));
        parts = []; for (var i = 0; i < n; i++) parts.push(make(true));
      }
      function frame(t) {
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          p.y -= p.vy;
          p.x += p.vx + Math.sin(t / 900 + p.ph) * 0.25;
          if (p.y < -10 || p.x < -10 || p.x > w + 10) parts[i] = make(false);
          var tw = 0.6 + 0.4 * Math.sin(t / 400 + p.ph);
          ctx.beginPath();
          ctx.fillStyle = 'rgba(110,231,183,' + (p.a * tw) + ')';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 12;
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(frame);
      }
      window.addEventListener('resize', init);
      init();
      requestAnimationFrame(frame);
    })();
  </script>

  <script>
    (function () {
      var btn = document.getElementById('discordBtn');
      var toast = document.getElementById('toast');
      var timer;

      function show(text) {
        if (text) toast.firstChild.textContent = text + ' ';
        toast.classList.add('show');
        clearTimeout(timer);
        timer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
      }

      function fallbackCopy(value) {
        var ta = document.createElement('textarea');
        ta.value = value;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
      }

      btn.addEventListener('click', function () {
        var name = 'v3i3';
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(name).catch(function () { fallbackCopy(name); });
        } else {
          fallbackCopy(name);
        }
        show('Discord username copied:');
      });
    })();
  </script>
